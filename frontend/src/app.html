<!doctype html>
<html lang="id" class="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>KasirPro - Sistem Kasir Modern Indonesia</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
		<script>
			try {
				const stored = localStorage.getItem('kasirpro_theme');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (stored === 'dark' || (!stored && prefersDark)) {
					document.documentElement.classList.add('dark');
					document.documentElement.classList.remove('light');
				} else {
					document.documentElement.classList.remove('dark');
					document.documentElement.classList.add('light');
				}
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#FFFDF7] dark:bg-[#121212] text-black dark:text-white transition-colors duration-150 font-sans antialiased min-h-screen">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

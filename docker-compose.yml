services:
  mysql:
    image: mysql:8.0
    container_name: kasirpro_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kasirpro
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasirpro_backend
    restart: unless-stopped
    environment:
      APP_NAME: KasirPro
      APP_ENV: production
      PORT: 8080
      APP_URL: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: kasirpro
      JWT_SECRET: super_secret_jwt_key_kasirpro_256bit_minimum_length_required!
      JWT_ACCESS_EXPIRE_MINUTES: 1440
      JWT_REFRESH_EXPIRE_DAYS: 7
      MIDTRANS_SERVER_KEY: SB-Mid-server-simulator-mock-key-12345
      MIDTRANS_CLIENT_KEY: SB-Mid-client-simulator-mock-key-12345
      MIDTRANS_IS_PRODUCTION: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173"
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kasirpro_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      PUBLIC_API_URL: /api/v1
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: kasirpro_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  uploads_data:
